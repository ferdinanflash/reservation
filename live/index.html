		<script>
		// /live shows ONLY the SvS Enemies page: open it straight away.
		// Deferred scripts have already run when DOMContentLoaded fires.
		window.addEventListener('DOMContentLoaded', function () {
			if (typeof showSvSEnemiesMenu === 'function') showSvSEnemiesMenu();
			// Keep a page left open reasonably fresh. The server cache makes this cheap
			// (it only re-fetches WoS Atlas when the cached data is older than 2 hours).
			setInterval(function () {
				if (document.visibilityState === 'visible' && typeof refreshSvSEnemiesView === 'function') {
					refreshSvSEnemiesView();
				}
			}, 10 * 60 * 1000);
		});
