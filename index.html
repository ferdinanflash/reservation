<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVS Ministry Layout</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="navbar">
        <span class="logo">SVS Ministry</span>
        <button id="admin-toggle-btn" class="btn-admin" onclick="toggleAdminMode()">Admin Login</button>
    </header>

    <main class="container">
        <section id="positions-page">
            <h1 class="page-title">SVS Ministry Position</h1>
            <p class="page-subtitle">Select a position to learn more</p>
            <div class="list-container">
                <div class="list-item" onclick="showSchedule('Vice President D1')"><span>Vice President D1</span><span class="arrow">&gt;</span></div>
                <div class="list-item" onclick="showSchedule('Vice President D2')"><span>Vice President D2</span><span class="arrow">&gt;</span></div>
            </div>
        </section>

        <section id="schedule-page" class="hidden">
            <button class="btn-back" onclick="showPositions()">&lt; Back to positions</button>
            <h1 class="page-title" id="selected-title">Position Title</h1>
            <h3 class="section-title">Time Slot Schedule <span id="admin-indicator" style="color:#ef4444; font-size:0.8rem; display:none;">(ADMIN MODE)</span></h3>
            
            <div class="timezone-selector">
                <label for="timezone">Display Time Zone:</label>
                <select id="timezone" onchange="renderTimeSlots()">
                    <option value="0">UTC +00:00</option>
                    <option value="7" selected>UTC +07:00 (Jakarta)</option>
                    <option value="8">UTC +08:00 (Singapore)</option>
                    <option value="-5">UTC -05:00 (EST)</option>
                </select>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ACTION</th>
                            <th>PREFERRED TIME (UTC)</th>
                            <th>STATUS / APPLICATIONS</th>
                            <th>IN-GAME NICKNAME</th>
                            <th>IN-GAME ID</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-table-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js?v=4"></script>
</body>
</html>
