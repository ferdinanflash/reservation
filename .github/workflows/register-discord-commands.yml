name: Register 3475 Discord Commands

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Register /redeem commands
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: "1570932450849333450"
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
        run: node scripts/register-discord-commands.mjs
