# Inside your custom pipeline text file under .github/workflows/
steps:
  - name: Checkout repository
    uses: actions/checkout@v6         # Upgrade from @v4 to @v6 to support Node 24

  - name: Setup Node environment
    uses: actions/setup-node@v6       # Upgrade from @v4 to @v6 to support Node 24
    with:
      node-version: '24'              # Explicitly declare Node 24 here

  - name: Upload Pages Artifact
    uses: actions/upload-pages-artifact@v3 

  - name: Deploy to GitHub Pages
    uses: actions/deploy-pages@v5     # Upgrade from @v4 to @v5 to support Node 24
