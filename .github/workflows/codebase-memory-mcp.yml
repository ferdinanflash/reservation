name: Codebase Memory MCP

on:
  push:
    paths:
      - "tools/codebase-memory-mcp/**"
      - ".github/workflows/codebase-memory-mcp.yml"
  pull_request:
    paths:
      - "tools/codebase-memory-mcp/**"
      - ".github/workflows/codebase-memory-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/codebase-memory-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Run safety tests
        run: npm test
