name: Codebase Memory MCP

on:
  push:
    paths:
      - "index.html"
      - "live/**"
      - "common.js"
      - "lang.js"
      - "style.css"
      - "sw.js"
      - "site.webmanifest"
      - "fire-banner.js"
      - "opening-animation.js"
      - "js/**"
      - "supabase/**"
      - "*.sql"
      - "docs/codebase-memory/features/**"
      - "docs/codebase-memory/decisions/**"
      - "docs/codebase-memory/known-issues.md"
      - "tools/codebase-memory-mcp/**"
      - ".github/workflows/codebase-memory-mcp.yml"
  pull_request:
    paths:
      - "index.html"
      - "live/**"
      - "common.js"
      - "lang.js"
      - "style.css"
      - "sw.js"
      - "site.webmanifest"
      - "fire-banner.js"
      - "opening-animation.js"
      - "js/**"
      - "supabase/**"
      - "*.sql"
      - "docs/codebase-memory/features/**"
      - "docs/codebase-memory/decisions/**"
      - "docs/codebase-memory/known-issues.md"
      - "tools/codebase-memory-mcp/**"
      - ".github/workflows/codebase-memory-mcp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codebase-memory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install MCP dependencies
        working-directory: tools/codebase-memory-mcp
        run: npm install
      - name: Type-check MCP
        working-directory: tools/codebase-memory-mcp
        run: npm run typecheck
      - name: Run tests
        working-directory: tools/codebase-memory-mcp
        run: npm test
      - name: Generate deterministic repository map
        working-directory: tools/codebase-memory-mcp
        run: npm run index
      - name: Verify deterministic generation
        working-directory: tools/codebase-memory-mcp
        run: |
          cp ../../docs/codebase-memory/generated/repository-map.json /tmp/repository-map-first.json
          npm run index
          cmp /tmp/repository-map-first.json ../../docs/codebase-memory/generated/repository-map.json
      - name: Generate AST dependency graph
        working-directory: tools/codebase-memory-mcp
        run: npm run ast
      - name: Verify deterministic AST graph
        working-directory: tools/codebase-memory-mcp
        run: |
          cp ../../docs/codebase-memory/generated/ast-dependency-graph.json /tmp/ast-graph-first.json
          npm run ast
          cmp /tmp/ast-graph-first.json ../../docs/codebase-memory/generated/ast-dependency-graph.json
      - name: Validate generated repository map
        working-directory: tools/codebase-memory-mcp
        run: npm run check:index
      - name: Require generated map updates in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- docs/codebase-memory/generated/repository-map.json docs/codebase-memory/generated/ast-dependency-graph.json
      - name: Commit refreshed map
        if: github.event_name != 'pull_request'
        working-directory: tools/codebase-memory-mcp
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            npm run index
            npm run ast
            if git diff --quiet -- ../../docs/codebase-memory/generated/repository-map.json ../../docs/codebase-memory/generated/ast-dependency-graph.json; then
              exit 0
            fi
            git add ../../docs/codebase-memory/generated/repository-map.json ../../docs/codebase-memory/generated/ast-dependency-graph.json
            git commit -m "chore: refresh codebase memory index"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push race detected; retrying against latest branch head (attempt $attempt)."
          done
          echo "Could not publish generated memory files after three attempts."
          exit 1
