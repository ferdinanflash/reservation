name: Discord Edge Function Tests

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/**"
      - "supabase/functions/discord-announcement-retry/**"
      - "supabase/functions/discord-guild-settings/**"
      - "supabase/functions/discord-interactions/**"
      - ".github/workflows/discord-edge-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/_shared/**"
      - "supabase/functions/discord-interactions/**"
      - "supabase/functions/discord-announcement-retry/**"
      - "supabase/functions/discord-guild-settings/**"
      - ".github/workflows/discord-edge-tests.yml"

permissions:
  contents: read

jobs:
  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run Discord permission tests
        run: deno test supabase/functions/_shared/discord-permissions.test.ts
      - name: Type-check Discord interactions
        run: deno check supabase/functions/discord-interactions/index.ts
