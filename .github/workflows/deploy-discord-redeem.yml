name: Deploy 3475 Discord Redeem Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: pwqkpeykjyujhnreleax
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN in GitHub repository Actions secrets."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.58.5

      - name: Deploy existing redeem backend
        run: supabase functions deploy redeem-giftcode --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy Discord interactions endpoint
        run: supabase functions deploy discord-interactions --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --yes
